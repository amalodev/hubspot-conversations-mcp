name: Release

# Ships a release from main: when package.json holds a version that is not on
# npm yet, this workflow runs the tests, creates the v<version> tag + GitHub
# release, and publishes that release to npm. Pushes without a version bump are
# no-ops. Releases created here use the workflow's GITHUB_TOKEN, which never
# triggers other workflows — so the publish happens in this same run. The
# release trigger exists for manually published releases (e.g. retrying a
# publish for an existing tag).

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # create the tag + GitHub release
  id-token: write # npm publish --provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check whether this version is already on npm
        id: version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ON_NPM=$(npm view "hubspot-conversations-mcp@$VERSION" version 2>/dev/null || true)
          if [ -n "$ON_NPM" ]; then
            echo "::notice::hubspot-conversations-mcp@$VERSION is already on npm — nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the three version fields agree
        if: steps.version.outputs.new == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MANIFEST=$(node -p 'require("./manifest.json").version')
          SERVER=$(node -p '(require("fs").readFileSync("src/server.ts", "utf8").match(/SERVER_VERSION\s*=\s*"([^"]+)"/) || [, "missing"])[1]')
          if [ "$MANIFEST" != "$VERSION" ] || [ "$SERVER" != "$VERSION" ]; then
            echo "::error::Version mismatch: package.json=$VERSION, manifest.json=$MANIFEST, server.ts SERVER_VERSION=$SERVER. Bump all three."
            exit 1
          fi

      - name: Install
        if: steps.version.outputs.new == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.version.outputs.new == 'true'
        run: npm run typecheck
      - name: Test
        if: steps.version.outputs.new == 'true'
        run: npm test
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: npm run build

      - name: Create the GitHub release
        if: steps.version.outputs.new == 'true' && github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — publishing it to npm."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      # prepublishOnly builds and runs the tests once more before the upload
      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
